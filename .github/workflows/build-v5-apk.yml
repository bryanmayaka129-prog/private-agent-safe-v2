name: PrivateAgent G.I.C. V5 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'PrivateAgent_GIC_Hardened_V5_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build V5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: extracted/PrivateAgent_GIC_Hardened_V5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and inspect V5 project configuration
        shell: bash
        run: |
          set -euo pipefail
          archive='PrivateAgent_GIC_Hardened_V5_Source.zip'
          test -f "$archive" || { echo "Missing archive: $archive"; exit 1; }

          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..) echo "Unsafe archive entry: $entry" >&2; exit 1 ;;
              PrivateAgent_GIC_Hardened_V5|PrivateAgent_GIC_Hardened_V5/*) ;;
              *) echo "Unexpected archive root: $entry" >&2; exit 1 ;;
            esac
          done < <(unzip -Z1 "$archive")

          mkdir -p extracted
          unzip -q "$archive" -d extracted

          test -f "$PROJECT_DIR/pubspec.yaml" || {
            echo "Flutter project not found at $PROJECT_DIR"
            exit 1
          }

          test -d "$PROJECT_DIR/android" || {
            echo "Android project directory is missing"
            exit 1
          }

          echo '--- Flutter/Dart configuration ---'
          cat "$PROJECT_DIR/pubspec.yaml"

          echo '--- Android build configuration ---'
          for file in \
            "$PROJECT_DIR/android/settings.gradle" \
            "$PROJECT_DIR/android/settings.gradle.kts" \
            "$PROJECT_DIR/android/build.gradle" \
            "$PROJECT_DIR/android/build.gradle.kts" \
            "$PROJECT_DIR/android/app/build.gradle" \
            "$PROJECT_DIR/android/app/build.gradle.kts" \
            "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" \
            "$PROJECT_DIR/android/gradle.properties"; do
            if [[ -f "$file" ]]; then
              echo "--- $file ---"
              cat "$file"
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: extracted/PrivateAgent_GIC_Hardened_V5/pubspec.lock

      - name: Report toolchain versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        id: pub-get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze Flutter project
        id: analyze
        if: ${{ steps.pub-get.outcome == 'success' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run automated tests
        id: tests
        if: ${{ always() && steps.pub-get.outcome == 'success' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        id: apk-build
        if: ${{ always() && steps.pub-get.outcome == 'success' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload release APK artifact
        if: ${{ always() && steps.apk-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: privateagent-gic-v5-release-apk
          path: extracted/PrivateAgent_GIC_Hardened_V5/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
