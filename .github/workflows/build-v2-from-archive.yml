name: PrivateAgent GIC Hardened V2 APK Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='PrivateAgent_GIC_Hardened_V2_Source(2).zip'
          test -f "$ARCHIVE"
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/PrivateAgent_GIC_Hardened_V2"
          test -f "$PROJECT_DIR/pubspec.yaml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Remove unused dependency
        working-directory: extracted/PrivateAgent_GIC_Hardened_V2
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="pubspec.yaml"
          COUNT=$(grep -c '  share_plus: \^13.2.0' "$PUBSPEC" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 occurrence of '  share_plus: ^13.2.0' in pubspec.yaml, found $COUNT"
            exit 1
          fi
          sed -i '/^  share_plus: \^13.2.0$/d' "$PUBSPEC"
          echo "Removed unused share_plus dependency"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: extracted/PrivateAgent_GIC_Hardened_V2
        run: flutter pub get
      - name: Run tests
        working-directory: extracted/PrivateAgent_GIC_Hardened_V2
        run: flutter test
      - name: Build release APK
        working-directory: extracted/PrivateAgent_GIC_Hardened_V2
        run: flutter build apk --release
      - name: Sign and verify APK for testing
        shell: bash
        working-directory: extracted/PrivateAgent_GIC_Hardened_V2
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          STORE_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/privateagent-v2-temp.jks" -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias safe-v2 -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=PrivateAgent GIC Hardened V2 Temporary Test Key'
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/privateagent-v2-temp.jks" --ks-key-alias safe-v2 --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" --out dist/PrivateAgent-GIC-Hardened-V2.apk "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/PrivateAgent-GIC-Hardened-V2.apk
          sha256sum dist/PrivateAgent-GIC-Hardened-V2.apk > dist/SHA256SUMS.txt
          echo 'Temporary signing key: future builds will not update this installation; uninstall this test APK before installing a later build.'
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: privateagent-gic-hardened-v2
          path: extracted/PrivateAgent_GIC_Hardened_V2/dist/*
          if-no-files-found: error
        retention-days: 14
